<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renad Ahmed Mohammed Said – CV, LinkedIn and Infographic</title>
<style>
:root{--bg:#e6eaf2;--surface:#eef1f7;--ink:#243049;--muted:#56637e;--accent:#4a5a9a;--c1:#7f8fc9;--c3:#9ec6ba;--sd:rgba(98,112,150,.28);--sl:rgba(255,255,255,.85);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b2130;--surface:#232a3b;--ink:#e7ebf5;--muted:#a3adc4;--accent:#a9b8f0;--c1:#6676b4;--c3:#4f7d71;--sd:rgba(0,0,0,.5);--sl:rgba(255,255,255,.05)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 40px}
h1{font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.15;margin:0 0 8px}
.role{color:var(--muted);margin:0 0 24px}
.btns{display:grid;gap:14px;margin-bottom:28px}
.btn{display:block;text-align:center;text-decoration:none;font-weight:600;color:var(--ink);background:var(--surface);padding:15px 20px;border-radius:18px;box-shadow:7px 7px 16px var(--sd),-7px -7px 16px var(--sl)}
.btn.main{background:linear-gradient(145deg,var(--c1),var(--c3));color:#fff;text-shadow:0 1px 2px rgba(30,40,70,.35)}
.btn:focus-visible{outline:3px solid var(--c1);outline-offset:3px}
h2{font-size:1.2rem;margin:0 0 12px}
.info{display:block;background:var(--surface);padding:10px;border-radius:22px;box-shadow:10px 10px 24px var(--sd),-10px -10px 24px var(--sl)}
.info img{width:100%;height:auto;display:block;border-radius:14px}
.hint{color:var(--muted);font-size:.92rem;margin:10px 4px 0}
</style></head>
<body><div class="wrap">
<h1>Renad Ahmed Mohammed Said</h1>
<p class="role">Machine Learning Developer · Artificial Intelligence · Digital Pioneers Initiative</p>
<div class="btns">
<a class="btn main" href="cv.pdf">Open my CV</a>
<a class="btn" href="https://www.linkedin.com/in/renad-ahmed28/" target="_blank" rel="noopener">LinkedIn profile</a>
<a class="btn" href="https://renad7777.github.io/" target="_blank" rel="noopener">Portfolio</a>
<a class="btn" href="https://github.com/Renad7777" target="_blank" rel="noopener">GitHub</a>
</div>
<h2>Project infographic: OncoVision</h2>
<a class="info" href="infographic.jpg"><img src="infographic.jpg" alt="OncoVision project infographic"></a>
<p class="hint">Tap the image to open it full size.</p>
</div></body></html>
